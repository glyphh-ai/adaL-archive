# Logical operators, built from layer-0 logical primes.

- key: logic.and
  category: connective
  entity:   {name: and, kind: logical-operator}
  semantic: {category: conjunction}
  composed_of: [prime.all]
  source: "Boolean logic"

- key: logic.or
  category: connective
  entity:   {name: or, kind: logical-operator}
  semantic: {category: disjunction}
  composed_of: [prime.some]
  source: "Boolean logic"

- key: logic.not
  category: connective
  entity:   {name: not, kind: logical-operator}
  semantic: {category: negation}
  composed_of: [prime.not]
  source: "Boolean logic"

- key: logic.xor
  category: connective
  entity:   {name: xor, kind: logical-operator}
  semantic: {category: exclusive-disjunction}
  composed_of: [logic.or, logic.not, logic.and]
  source: "Boolean logic"

- key: logic.implies
  category: connective
  entity:   {name: implies, kind: logical-operator}
  semantic: {category: material-conditional}
  composed_of: [prime.if, prime.because]
  source: "propositional logic"

- key: logic.equals
  category: connective
  entity:   {name: equals, kind: logical-operator}
  semantic: {category: identity-relation}
  composed_of: [prime.the_same]
  source: "elementary mathematics"

- key: logic.not_equals
  category: connective
  entity:   {name: "not equals", kind: logical-operator}
  semantic: {category: non-identity-relation}
  composed_of: [prime.the_same, prime.not]
  source: "elementary mathematics"

- key: logic.greater
  category: comparator
  entity:   {name: "greater than", kind: comparator}
  semantic: {category: ordering-relation}
  composed_of: [prime.more]
  source: "elementary mathematics"

- key: logic.less
  category: comparator
  entity:   {name: "less than", kind: comparator}
  semantic: {category: ordering-relation}
  composed_of: [prime.more, prime.not]
  source: "elementary mathematics"
