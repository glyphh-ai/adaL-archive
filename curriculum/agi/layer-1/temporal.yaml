# Basic temporal concepts, built from layer-0 time primes.

- key: time.day
  category: time-unit
  entity:   {name: day, kind: time-unit}
  temporal: {duration: "24-hours", frequency: cyclic}
  composed_of: [prime.when, prime.long_time]
  source: "elementary timekeeping"

- key: time.night
  category: time-unit
  entity:   {name: night, kind: time-unit}
  temporal: {duration: "half-day", frequency: cyclic}
  composed_of: [prime.when, time.day, prime.not]
  source: "elementary timekeeping"

- key: time.morning
  category: time-part
  entity:   {name: morning, kind: time-part}
  temporal: {time: early-day, duration: short}
  composed_of: [prime.when, time.day, prime.before]
  source: "elementary timekeeping"

- key: time.evening
  category: time-part
  entity:   {name: evening, kind: time-part}
  temporal: {time: late-day, duration: short}
  composed_of: [prime.when, time.day, prime.after]
  source: "elementary timekeeping"

- key: time.hour
  category: time-unit
  entity:   {name: hour, kind: time-unit}
  temporal: {duration: "3600-seconds"}
  composed_of: [prime.when, prime.short_time]
  source: "SI / elementary timekeeping"

- key: time.minute
  category: time-unit
  entity:   {name: minute, kind: time-unit}
  temporal: {duration: "60-seconds"}
  composed_of: [prime.when, prime.short_time, prime.little]
  source: "SI / elementary timekeeping"

- key: time.second
  category: time-unit
  entity:   {name: second, kind: time-unit}
  temporal: {duration: "1-second"}
  composed_of: [prime.when, prime.moment]
  source: "SI"

- key: time.year
  category: time-unit
  entity:   {name: year, kind: time-unit}
  temporal: {duration: "365-days"}
  composed_of: [prime.when, prime.long_time, prime.many, time.day]
  source: "elementary timekeeping"

- key: time.past
  category: time-reference
  entity:   {name: past, kind: time-reference}
  temporal: {time: before-now}
  composed_of: [prime.before, prime.now]
  source: "elementary"

- key: time.present
  category: time-reference
  entity:   {name: present, kind: time-reference}
  temporal: {time: at-now}
  composed_of: [prime.now]
  source: "elementary"

- key: time.future
  category: time-reference
  entity:   {name: future, kind: time-reference}
  temporal: {time: after-now}
  composed_of: [prime.after, prime.now]
  source: "elementary"
