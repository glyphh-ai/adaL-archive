[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada"
version = "0.2.0"
description = "A self-evolving cognitive brain for LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ada AI", email = "support@ada.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies — SQLite only, no Postgres/Docker needed.
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
    "mcp>=1.26.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
# LLM backends — Ada's voice (Qwen3-1.5B local inference)
mlx = [
    "mlx>=0.18.0",
    "mlx-lm>=0.20.0",
    "huggingface-hub>=0.20.0",
]
llm = [
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.20.0",
]
audio = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "opensmile>=2.5.0",
]
telemetry = [
    "prometheus-client>=0.17.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.82.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.0.285",
]

[project.scripts]
ada = "ada.tui.cli:main"

[project.urls]
Repository = "https://github.com/timmetim/ada"

[tool.setuptools.packages.find]
# ada* — SDK + CLI + server entry point (ada/server.py)
# The remaining packages are the server-side runtime bundled for `ada dev`
include = ["ada*", "domains*", "api*", "infrastructure*", "shared*", "scripts*"]

[tool.setuptools.package-data]
"ada" = []
"ada.intent" = ["data/*.json", "data/*.jsonl", "data/packs/*.json"]
"ada.state" = ["data/*.json", "data/packs/*.json"]
"ada.memory" = ["lessons/*.jsonl", "foundation/*.yaml"]
