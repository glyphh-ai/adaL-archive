# Berlin & Kay's 11 universal color terms (1969).
# Each entry cites the layer-0 primes it's composed from. Color requires
# `prime.see` (perception) and `prime.something` (something to perceive on).

- key: color.black
  category: color
  entity:    {name: black, kind: color}
  perceptual: {color: black, temperature: neutral}
  semantic:  {category: achromatic}
  composed_of: [prime.see, prime.something, prime.not]
  source: "Berlin & Kay 1969"

- key: color.white
  category: color
  entity:    {name: white, kind: color}
  perceptual: {color: white, temperature: neutral}
  semantic:  {category: achromatic}
  composed_of: [prime.see, prime.something, prime.all]
  source: "Berlin & Kay 1969"

- key: color.red
  category: color
  entity:    {name: red, kind: color}
  perceptual: {color: red, temperature: warm}
  semantic:  {category: primary, subcategory: chromatic}
  composed_of: [prime.see, prime.something]
  source: "Berlin & Kay 1969"

- key: color.green
  category: color
  entity:    {name: green, kind: color}
  perceptual: {color: green, temperature: cool}
  semantic:  {category: primary, subcategory: chromatic}
