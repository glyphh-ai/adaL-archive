# Spatial directions and prepositions, layered on the layer-0 space primes.

- key: spatial.north
  category: cardinal-direction
  entity:  {name: north, kind: spatial-direction}
  spatial: {direction: "0-degrees"}
  composed_of: [prime.where, prime.above]
  source: "geographic convention"

- key: spatial.south
  category: cardinal-direction
  entity:  {name: south, kind: spatial-direction}
  spatial: {direction: "180-degrees"}
  composed_of: [prime.where, prime.below]
  source: "geographic convention"

- key: spatial.east
  category: cardinal-direction
  entity:  {name: east, kind: spatial-direction}
  spatial: {direction: "90-degrees"}
  composed_of: [prime.where, prime.side]
  source: "geographic convention"

- key: spatial.west
  category: cardinal-direction
  entity:  {name: west, kind: spatial-direction}
  spatial: {direction: "270-degrees"}
  composed_of: [prime.where, prime.side]
  source: "geographic convention"

- key: spatial.up
  category: relative-direction
  entity:  {name: up, kind: spatial-direction}
  spatial: {direction: vertical-positive}
  composed_of: [prime.above]
  source: "elementary geometry"

- key: spatial.down
  category: relative-direction
  entity:  {name: down, kind: spatial-direction}
  spatial: {direction: vertical-negative}
  composed_of: [prime.below]
  source: "elementary geometry"

- key: spatial.left
  category: relative-direction
  entity:  {name: left, kind: spatial-direction}
  spatial: {direction: lateral-negative}
  composed_of: [prime.side]
  source: "elementary geometry"

- key: spatial.right
  category: relative-direction
  entity:  {name: right, kind: spatial-direction}
  spatial: {direction: lateral-positive}
  composed_of: [prime.side]
  source: "elementary geometry"

- key: spatial.front
  category: relative-direction
  entity:  {name: front, kind: spatial-direction}
  spatial: {direction: depth-positive}
  composed_of: [prime.where]
  source: "elementary geometry"

- key: spatial.back
  category: relative-direction
  entity:  {name: back, kind: spatial-direction}
  spatial: {direction: depth-negative}
  composed_of: [prime.where]
  source: "elementary geometry"

- key: spatial.in
  category: preposition
  entity:  {name: in, kind: preposition}
  spatial: {direction: containment}
  composed_of: [prime.inside]
  source: "English preposition"

- key: spatial.out
  category: preposition
  entity:  {name: out, kind: preposition}
  spatial: {direction: exterior}
  composed_of: [prime.inside, prime.not]
  source: "English preposition"

- key: spatial.on
  category: preposition
  entity:  {name: on, kind: preposition}
  spatial: {direction: surface-contact}
  composed_of: [prime.above, prime.touch]
  source: "English preposition"

- key: spatial.between
  category: preposition
  entity:  {name: between, kind: preposition}
  spatial: {direction: enclosed-by-two}
  composed_of: [prime.where, prime.two]
  source: "English preposition"

- key: spatial.around
  category: preposition
  entity:  {name: around, kind: preposition}
  spatial: {direction: surrounding}
  composed_of: [prime.where, prime.near, prime.all]
  source: "English preposition"
